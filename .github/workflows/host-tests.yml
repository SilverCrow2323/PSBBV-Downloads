name: PSBBV Downloads host tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build with warnings as errors
        run: cmake --build build --parallel
      - name: Run transfer state and request policy tests
        run: ctest --test-dir build --output-on-failure
      - name: Validate node manifest
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python tests/validate_manifest.py
